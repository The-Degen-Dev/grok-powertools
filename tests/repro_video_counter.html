<!DOCTYPE html>
<html>

<head>
    <style>
        /* Mimic classes for querying */
        .text-white.text-xs.tabular-nums.font-semibold {
            color: white;
        }
    </style>
</head>

<body>
    <div id="container">
        <!-- Main 'Make Video' Button -->
        <button aria-label="Make video" id="make-video-btn">Make Video</button>

        <!-- Textarea -->
        <textarea></textarea>

        <!-- Existing Videos (Scenario: 1 existing video) -->
        <div id="video-list">
            <button aria-label="Video Options" class="existing-video">Video 1</button>
        </div>
    </div>

    <script>
        // Logic to simulate the 'Grok' app behavior
        document.getElementById('make-video-btn').addEventListener('click', () => {
            // Simulate delay then new video appears
            setTimeout(() => {
                const btn = document.createElement('button');
                btn.setAttribute('aria-label', 'Video Options');

                // Percentage indicator
                const pct = document.createElement('div');
                pct.className = "text-white text-xs tabular-nums font-semibold";
                pct.textContent = "0%";
                btn.appendChild(pct);

                document.getElementById('video-list').appendChild(btn);
            }, 2000); // 2 second delay to start
        });
    </script>
</body>

</html>
