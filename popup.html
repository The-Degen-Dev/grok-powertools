<!DOCTYPE html>
<html>

<head>
    <title>Grok Vault</title>
    <link rel="stylesheet" type="text/css" href="popup.css">
    <meta charset="UTF-8">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo-area">
                <div class="logo-icon"></div>
                <h1>Grok Vault</h1>
            </div>
            <div class="pill-badge">v0.2.0</div>
        </header>

        <!-- Main Status Card -->
        <div class="card status-card">
            <div class="status-header">
                <span class="label">STATUS</span>
                <span id="statusText" class="value">Ready</span>
            </div>
            <div class="progress-track">
                <div id="progressFill" class="progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <!-- Primary Controls -->
        <div class="controls-grid">
            <button id="startBtn" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                Start Sync
            </button>
            <button id="stopBtn" class="btn btn-danger" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                </svg>
                Stop
            </button>
        </div>

        <!-- Video Settings -->
        <div class="card settings-card">
            <div class="card-header">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 7l-7 5 7 5V7z" />
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
                </svg>
                <h3>Global Settings</h3>
            </div>
            <div class="setting-row">
                <label for="downloadPathInput">Download Folder</label>
                <div class="text-input-wrapper">
                    <input type="text" id="downloadPathInput" placeholder="GrokVault" value="GrokVault">
                </div>
            </div>
            <div class="setting-row">
                <label for="autoRetryCheckbox">Enable Auto-Retry</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="autoRetryCheckbox">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <label for="maxRetriesInput">Max Retries</label>
                <div class="number-input-wrapper">
                    <input type="number" id="maxRetriesInput" value="3" min="1" max="50">
                </div>
            </div>
        </div>

        <!-- Cloud Backup Settings -->
        <div class="card settings-card">
            <div class="card-header">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25" />
                    <line x1="8" y1="16" x2="8.01" y2="16" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                    <line x1="16" y1="16" x2="16.01" y2="16" />
                </svg>
                <h3>Cloud Backup (R2)</h3>
            </div>
            <div class="setting-row cloud-field-row">
                <label for="cloudModeSelect">Backup Mode</label>
                <div class="select-input-wrapper cloud-input-wide">
                    <select id="cloudModeSelect">
                        <option value="local_only">Local only</option>
                        <option value="cloud_only">Cloud only (R2)</option>
                        <option value="dual_write">Dual-write (Local + R2)</option>
                    </select>
                </div>
            </div>
            <div class="setting-row cloud-field-row">
                <label for="cloudWorkerUrlInput">Worker URL</label>
                <div class="text-input-wrapper cloud-input-wide">
                    <input type="text" id="cloudWorkerUrlInput" placeholder="https://your-worker.workers.dev">
                </div>
            </div>
            <div class="setting-row cloud-field-row">
                <label for="cloudApiKeyInput">API Key</label>
                <div class="text-input-wrapper cloud-input-wide">
                    <input type="password" id="cloudApiKeyInput" placeholder="x-gpt-api-key value">
                </div>
            </div>
            <div class="setting-row cloud-field-row">
                <label for="cloudKeyPrefixInput">Key Prefix</label>
                <div class="text-input-wrapper cloud-input-wide">
                    <input type="text" id="cloudKeyPrefixInput" value="grok-powertools/v1">
                </div>
            </div>
            <div class="cloud-status-box" id="cloudStatusBox">
                <div class="cloud-status-row">
                    <span>Mode</span>
                    <span id="cloudModeBadge" class="status-pill neutral">Local Only</span>
                </div>
                <div class="cloud-status-row">
                    <span>Unsynced</span>
                    <span id="cloudUnsyncedCount">0</span>
                </div>
                <div class="cloud-status-row">
                    <span>Last Test</span>
                    <span id="cloudLastTest">Never</span>
                </div>
                <div class="cloud-status-row">
                    <span>Last Test Msg</span>
                    <span id="cloudLastTestMessage">None</span>
                </div>
                <div class="cloud-status-row">
                    <span>Last Error</span>
                    <span id="cloudLastError">None</span>
                </div>
            </div>
            <div class="cloud-actions-grid">
                <button id="cloudTestBtn" class="btn btn-secondary">Test Upload Pipeline</button>
                <button id="cloudRetryBtn" class="btn btn-secondary">Retry Unsynced</button>
                <button id="cloudBackfillBtn" class="btn btn-secondary" title="Uploads metadata only (prompts, history, processed IDs). Media files are not backfilled.">Run Backfill</button>
                <button id="cloudClearBtn" class="btn btn-secondary">Clear Cloud Status</button>
                <button id="cloudMediaBackupBtn" class="btn btn-primary"
                    title="Scrapes ALL favorites and uploads every media file to R2. Navigate to Grok Favorites first.">Full Media Backup</button>
            </div>
            <div id="r2BackupProgress" class="cloud-status-box" style="display: none;">
                <div class="cloud-status-row">
                    <span>Backup</span>
                    <span id="r2BackupStatus">Idle</span>
                </div>
                <div class="cloud-status-row">
                    <span>Progress</span>
                    <span id="r2BackupDetails">0 uploaded / 0 errors</span>
                </div>
                <button id="r2BackupStopBtn" class="btn btn-danger" style="display: none; margin-top: 6px;">Stop Backup</button>
            </div>
        </div>

        <!-- Logs Console -->
        <div class="card logs-card">
            <div class="card-header">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="4 17 10 11 4 5"></polyline>
                    <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
                <h3>Activity Log</h3>
            </div>
            <ul id="logList" class="log-list">
                <!-- Logs injected here -->
            </ul>
        </div>
    </div>
    <script src="cloudSyncUtils.js"></script>
    <script src="popup.js"></script>
</body>

</html>
